<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rincón de Cartas - Nuestra Historia</title>
    <style>
        :root {
            --bg-color: #070b19;
            --card-bg: rgba(30, 41, 59, 0.75);
            --accent-pink: #f43f5e;
            --accent-light: #fb7185;
            --text-color: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Partículas flotantes de fondo altamente visibles e iluminadas */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            color: #fb7185;
            font-weight: 900;
            font-size: 1.5rem;
            text-shadow: 0 0 12px rgba(244, 63, 94, 0.8), 0 0 25px rgba(251, 113, 133, 0.6);
            animation: floatUpAndPulse 7s ease-in-out infinite;
            white-space: nowrap;
            opacity: 0;
        }

        @keyframes floatUpAndPulse {
            0% {
                transform: translateY(110vh) scale(0.6) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 0.85;
            }
            50% {
                transform: translateY(50vh) scale(1.2) rotate(5deg);
                opacity: 1;
                text-shadow: 0 0 20px rgba(244, 63, 94, 1), 0 0 35px rgba(255, 255, 255, 0.8);
            }
            80% {
                opacity: 0.85;
            }
            100% {
                transform: translateY(-10vh) scale(0.9) rotate(-5deg);
                opacity: 0;
            }
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            z-index: 1;
        }

        header h1 {
            font-size: 2.2rem;
            margin-bottom: 6px;
            background: linear-gradient(45deg, #f43f5e, #ff758c, #ff7eb3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(244, 63, 94, 0.3);
        }

        header p {
            color: #cbd5e1;
            font-size: 1rem;
        }

        /* Contenedor Principal */
        .letters-container {
            width: 100%;
            max-width: 850px;
            z-index: 1;
            margin-bottom: 20px;
        }

        /* Grid de 2 columnas adaptado para celular */
        .letters-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        @media (max-width: 600px) {
            .letters-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }
        }

        /* Estilo del Sobre Animado */
        .envelope-card {
            background: var(--card-bg);
            border: 2px solid rgba(244, 63, 94, 0.4);
            border-radius: 18px;
            padding: 25px 20px;
            backdrop-filter: blur(15px);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), inset 0 0 15px rgba(244, 63, 94, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            min-height: 170px;
            justify-content: center;
            animation: cardFloat 4s ease-in-out infinite alternate;
        }

        .envelope-card:nth-child(2) { animation-delay: 1s; }
        .envelope-card:nth-child(3) { animation-delay: 2s; }
        .envelope-card:nth-child(4) { animation-delay: 3s; }

        @keyframes cardFloat {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-6px); }
        }

        .envelope-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #f43f5e, #fb7185, #ff758c);
        }

        .envelope-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: #fb7185;
            box-shadow: 0 15px 35px rgba(244, 63, 94, 0.5), 0 0 20px rgba(251, 113, 133, 0.4);
            background: rgba(30, 41, 59, 0.95);
        }

        /* Icono de sobre con animación de pulso */
        .envelope-icon {
            font-size: 3.2rem;
            margin-bottom: 10px;
            transition: transform 0.3s ease;
            filter: drop-shadow(0 0 8px rgba(244, 63, 94, 0.6));
        }

        .envelope-card:hover .envelope-icon {
            transform: scale(1.2) rotate(8deg);
        }

        .envelope-title {
            font-size: 1.15rem;
            color: #fb7185;
            font-weight: bold;
            margin-bottom: 5px;
            text-shadow: 0 0 8px rgba(251, 113, 133, 0.4);
        }

        .envelope-hint {
            font-size: 0.85rem;
            color: #94a3b8;
            font-style: italic;
        }

        /* Modal / Carta Abierta */
        #modal-carta {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(7, 11, 25, 0.88);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeInModal 0.3s ease;
        }

        @keyframes fadeInModal {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .carta-content {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 2px solid #fb7185;
            border-radius: 22px;
            padding: 30px 25px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(244, 63, 94, 0.5), 0 0 30px rgba(251, 113, 133, 0.3);
            position: relative;
            animation: slideUpCarta 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes slideUpCarta {
            from { transform: translateY(40px) scale(0.9); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .carta-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 10px;
        }

        .carta-title-modal {
            font-size: 1.3rem;
            color: #fb7185;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(251, 113, 133, 0.5);
        }

        .close-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.8rem;
            cursor: pointer;
            transition: color 0.2s;
            line-height: 1;
        }

        .close-btn:hover {
            color: white;
        }

        .carta-body p {
            font-size: 1rem;
            color: #e2e8f0;
            line-height: 1.65;
            text-align: justify;
            margin-bottom: 20px;
        }

        .carta-footer {
            font-size: 0.9rem;
            color: #fb7185;
            text-align: right;
            font-style: italic;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(251, 113, 133, 0.4);
        }
    </style>
</head>
<body>

    <!-- Partículas flotantes iluminadas -->
    <div class="particles" id="particles-container"></div>

    <header>
        <h1>Rincón de Cartas 💌</h1>
        <p>Toca un sobre para abrir tu mensaje de amor 🤍</p>
    </header>

    <div class="letters-container">
        <div class="letters-grid">
            
            <!-- Sobre 1 -->
            <div class="envelope-card" onclick="abrirCarta(1)">
                <div class="envelope-icon">✉️</div>
                <div class="envelope-title">Para mi amor 🤍</div>
                <div class="envelope-hint">Toca para abrir</div>
            </div>

            <!-- Sobre 2 -->
            <div class="envelope-card" onclick="abrirCarta(2)">
                <div class="envelope-icon">💌</div>
                <div class="envelope-title">Tu refugio seguro</div>
                <div class="envelope-hint">Toca para abrir</div>
            </div>

            <!-- Sobre 3 -->
            <div class="envelope-card" onclick="abrirCarta(3)">
                <div class="envelope-icon">💖</div>
                <div class="envelope-title">Nuestra complicidad</div>
                <div class="envelope-hint">Toca para abrir</div>
            </div>

            <!-- Sobre 4 -->
            <div class="envelope-card" onclick="abrirCarta(4)">
                <div class="envelope-icon">✨</div>
                <div class="envelope-title">Promesa y futuro</div>
                <div class="envelope-hint">Toca para abrir</div>
            </div>

        </div>
    </div>

    <!-- Modal para leer la carta abierta -->
    <div id="modal-carta" onclick="cerrarCartaFuera(event)">
        <div class="carta-content">
            <div class="carta-header">
                <span class="carta-title-modal" id="modal-titulo">Título</span>
                <button class="close-btn" onclick="cerrarCarta()">&times;</button>
            </div>
            <div class="carta-body">
                <p id="modal-texto">Contenido de la carta...</p>
            </div>
            <div class="carta-footer" id="modal-firma">Siempre tuyo</div>
        </div>
    </div>

    <script>
        const cartasData = {
            1: {
                titulo: "Para mi amor 🤍",
                texto: "Lo siento tanto por no poder estar ahí contigo en este momento físico, pero quería entregarte este detalle con todo mi corazón para que no te sientas sola ni seas solo una espectadora. Te amo con el alma, y ten por seguro que sí quiero una vida entera a tu lado.",
                firma: "Siempre tuyo"
            },
            2: {
                titulo: "Tu refugio seguro",
                texto: "Quiero que, cuando estés triste o hayas tenido un día pesado, puedas volver aquí, abrir este rinconcito y ver lo muchísimo que te amo para que logres relajarte o superar esos malos ratos. Estaré siempre aquí para consolarte, recordarte lo valiosa que eres y porque falta muy poquito para estar juntos de nuevo.",
                firma: "Para cuando lo necesites"
            },
            3: {
                titulo: "Nuestra complicidad",
                texto: "A pesar de la distancia, cada risa compartida, cada mensaje y cada sueño que tejemos juntos se han convertido en mi motor diario. Eres esa casualidad más hermosa que Dios puso en mi vida y cada segundo que pasa me enamoras más. Gracias por tu paciencia, por tu amor incondicional y por caminar de la mano conmigo en esta aventura.",
                firma: "Mi compañera de vida"
            },
            4: {
                titulo: "Promesa y futuro",
                texto: "Quiero contarte que estaré actualizando este pequeño apartado y añadiendo más sorpresas cada vez que tenga un tiempito libre, porque nuestra historia merece ser guardada en el lugar más bonito posible. Te amo muchísimo, mi amor, y ya quiero que llegue el día de abrazarte sin que ninguna pantalla nos separe.",
                firma: "Próximamente más sorpresas"
            }
        };

        function abrirCarta(id) {
            const data = cartasData[id];
            document.getElementById('modal-titulo').innerText = data.titulo;
            document.getElementById('modal-texto').innerText = data.texto;
            document.getElementById('modal-firma').innerText = data.firma;
            document.getElementById('modal-carta').style.display = 'flex';
        }

        function cerrarCarta() {
            document.getElementById('modal-carta').style.display = 'none';
        }

        function cerrarCartaFuera(event) {
            if (event.target.id === 'modal-carta') {
                cerrarCarta();
            }
        }

        // Generar partículas brillantes y grandes de "TE AMO"
        const particlesContainer = document.getElementById('particles-container');
        const frases = ["¡TE AMO 🤍!", "TE AMO BETZI ✨", "💖", "MI AMOR 💫", "TE AMO 💖"];
        
        function crearParticula() {
            const p = document.createElement('div');
            p.className = 'particle';
            p.innerText = frases[Math.floor(Math.random() * frases.length)];
            p.style.left = Math.random() * 90 + 'vw';
            p.style.animationDuration = (Math.random() * 3 + 5) + 's'; // Entre 5 y 8 segundos
            p.style.fontSize = (Math.random() * 0.7 + 1.2) + 'rem'; // Letras más grandes y notorias
            particlesContainer.appendChild(p);

            setTimeout(() => {
                p.remove();
            }, 8000);
        }

        // Crear una partícula cada 600 milisegundos para mayor dinamismo
        setInterval(crearParticula, 600);
    </script>
</body>
</html>
