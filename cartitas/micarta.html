<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rincón de Cartas - Nuestra Historia</title>
    <style>
        :root {
            --bg-color: #070b19;
            --card-bg: rgba(30, 41, 59, 0.8);
            --accent-pink: #f43f5e;
            --accent-light: #fb7185;
            --text-color: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Partículas optimizadas para no lagear el celular */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            color: #fb7185;
            font-weight: bold;
            font-size: 1.2rem;
            text-shadow: 0 0 10px rgba(244, 63, 94, 0.7), 0 0 20px rgba(251, 113, 133, 0.5);
            animation: floatUp 9s linear infinite;
            white-space: nowrap;
            opacity: 0;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(105vh) scale(0.7);
                opacity: 0;
            }
            15% { opacity: 0.8; }
            85% { opacity: 0.8; }
            100% {
                transform: translateY(-10vh) scale(1.1);
                opacity: 0;
            }
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            z-index: 1;
        }

        header h1 {
            font-size: 2rem;
            margin-bottom: 5px;
            background: linear-gradient(45deg, #f43f5e, #ff758c, #ff7eb3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(244, 63, 94, 0.3);
        }

        header p {
            color: #cbd5e1;
            font-size: 0.95rem;
        }

        /* Contenedor Principal */
        .letters-container {
            width: 100%;
            max-width: 800px;
            z-index: 1;
            margin-bottom: 20px;
        }

        /* Grid de 2 columnas adaptado para celular */
        .letters-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        @media (max-width: 600px) {
            .letters-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }
        }

        /* Estilo del Sobre Animado */
        .envelope-card {
            background: var(--card-bg);
            border: 2px solid rgba(244, 63, 94, 0.4);
            border-radius: 16px;
            padding: 22px 18px;
            backdrop-filter: blur(12px);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            min-height: 160px;
            justify-content: center;
        }

        .envelope-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #f43f5e, #fb7185);
        }

        .envelope-card:hover {
            transform: translateY(-5px);
            border-color: #fb7185;
            box-shadow: 0 12px 30px rgba(244, 63, 94, 0.4);
            background: rgba(30, 41, 59, 0.95);
        }

        .envelope-icon {
            font-size: 2.8rem;
            margin-bottom: 8px;
            transition: transform 0.3s ease;
            filter: drop-shadow(0 0 6px rgba(244, 63, 94, 0.5));
        }

        .envelope-card:hover .envelope-icon {
            transform: scale(1.15) rotate(5deg);
        }

        .envelope-title {
            font-size: 1.1rem;
            color: #fb7185;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .envelope-hint {
            font-size: 0.8rem;
            color: #94a3b8;
            font-style: italic;
        }

        /* Modal / Carta Abierta */
        #modal-carta {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(7, 11, 25, 0.85);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeInModal 0.3s ease;
        }

        @keyframes fadeInModal {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .carta-content {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 2px solid #fb7185;
            border-radius: 20px;
            padding: 25px 20px;
            max-width: 460px;
            width: 100%;
            box-shadow: 0 15px 40px rgba(244, 63, 94, 0.4);
            position: relative;
            animation: slideUpCarta 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes slideUpCarta {
            from { transform: translateY(30px) scale(0.9); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .carta-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
        }

        .carta-title-modal {
            font-size: 1.2rem;
            color: #fb7185;
            font-weight: bold;
        }

        .close-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.7rem;
            cursor: pointer;
            transition: color 0.2s;
            line-height: 1;
        }

        .close-btn:hover {
            color: white;
        }

        .carta-body p {
            font-size: 0.95rem;
            color: #e2e8f0;
            line-height: 1.6;
            text-align: justify;
            margin-bottom: 15px;
        }

        .carta-footer {
            font-size: 0.85rem;
            color: #fb7185;
            text-align: right;
            font-style: italic;
            font-weight: bold;
        }

        /* Botón flotante de música por si el navegador bloquea el autoplay */
        .music-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--card-bg);
            border: 2px solid var(--accent-pink);
            color: white;
            padding: 10px 15px;
            border-radius: 30px;
            cursor: pointer;
            z-index: 100;
            font-size: 0.85rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <!-- Audio de fondo -->
    <audio id="background-music" loop>
        <source src="../central/flores/sound/tu.mp3" type="audio/mpeg">
        Tu navegador no soporta audio.
    </audio>

    <!-- Botón de control de música -->
    <div class="music-control" onclick="toggleMusic()" id="music-btn">
        🎵 <span>Reproducir Música</span>
    </div>

    <!-- Partículas flotantes ligeras -->
    <div class="particles" id="particles-container"></div>

    <header>
        <h1>Rincón de Cartas 💌</h1>
        <p>Toca un sobre para abrir tu mensaje de amor 🤍</p>
    </header>

    <div class="letters-container">
        <div class="letters-grid">
            
            <!-- Sobre 1 -->
            <div class="envelope-card" onclick="abrirCarta(1)">
                <div class="envelope-icon">✉️</div>
                <div class="envelope-title">Para mi amor 🤍</div>
                <div class="envelope-hint">Toca para abrir</div>
            </div>

            <!-- Sobre 2 -->
            <div class="envelope-card" onclick="abrirCarta(2)">
                <div class="envelope-icon">💌</div>
                <div class="envelope-title">Tu refugio seguro</div>
                <div class="envelope-hint">Toca para abrir</div>
            </div>

            <!-- Sobre 3 -->
            <div class="envelope-card" onclick="abrirCarta(3)">
                <div class="envelope-icon">💖</div>
                <div class="envelope-title">Nuestra complicidad</div>
                <div class="envelope-hint">Toca para abrir</div>
            </div>

            <!-- Sobre 4 -->
            <div class="envelope-card" onclick="abrirCarta(4)">
                <div class="envelope-icon">✨</div>
                <div class="envelope-title">Promesa y futuro</div>
                <div class="envelope-hint">Toca para abrir</div>
            </div>

        </div>
    </div>

    <!-- Modal para leer la carta abierta -->
    <div id="modal-carta" onclick="cerrarCartaFuera(event)">
        <div class="carta-content">
            <div class="carta-header">
                <span class="carta-title-modal" id="modal-titulo">Título</span>
                <button class="close-btn" onclick="cerrarCarta()">&times;</button>
            </div>
            <div class="carta-body">
                <p id="modal-texto">Contenido de la carta...</p>
            </div>
            <div class="carta-footer" id="modal-firma">Siempre tuyo</div>
        </div>
    </div>

    <script>
        const cartasData = {
            1: {
                titulo: "Para mi amor 🤍",
                texto: "Lo siento tanto por no poder estar ahí contigo en este momento físico, pero quería entregarte este detalle con todo mi corazón para que no te sientas sola ni seas solo una espectadora. Te amo con el alma, y ten por seguro que sí quiero una vida entera a tu lado.",
                firma: "Siempre tuyo"
            },
            2: {
                titulo: "Tu refugio seguro",
                texto: "Quiero que, cuando estés triste o hayas tenido un día pesado, puedas volver aquí, abrir este rinconcito y ver lo muchísimo que te amo para que logres relajarte o superar esos malos ratos. Estaré siempre aquí para consolarte, recordarte lo valiosa que eres y porque falta muy poquito para estar juntos de nuevo.",
                firma: "Para cuando lo necesites"
            },
            3: {
                titulo: "Nuestra complicidad",
                texto: "A pesar de la distancia, cada risa compartida, cada mensaje y cada sueño que tejemos juntos se han convertido en mi motor diario. Eres esa casualidad más hermosa que Dios puso en mi vida y cada segundo que pasa me enamoras más. Gracias por tu paciencia, por tu amor incondicional y por caminar de la mano conmigo en esta aventura.",
                firma: "Mi compañera de vida"
            },
            4: {
                titulo: "Promesa y futuro",
                texto: "Quiero contarte que estaré actualizando este pequeño apartado y añadiendo más sorpresas cada vez que tenga un tiempito libre, porque nuestra historia merece ser guardada en el lugar más bonito posible. Te amo muchísimo, mi amor, y ya quiero que llegue el día de abrazarte sin que ninguna pantalla nos separe.",
                firma: "Próximamente más sorpresas"
            }
        };

        function abrirCarta(id) {
            const data = cartasData[id];
            document.getElementById('modal-titulo').innerText = data.titulo;
            document.getElementById('modal-texto').innerText = data.texto;
            document.getElementById('modal-firma').innerText = data.firma;
            document.getElementById('modal-carta').style.display = 'flex';
        }

        function cerrarCarta() {
            document.getElementById('modal-carta').style.display = 'none';
        }

        function cerrarCartaFuera(event) {
            if (event.target.id === 'modal-carta') {
                cerrarCarta();
            }
        }

        // Reproducir música al cargar o mediante botón
        const music = document.getElementById('background-music');
        const musicBtn = document.getElementById('music-btn');
        let isPlaying = false;

        window.addEventListener('DOMContentLoaded', () => {
            music.volume = 0.5;
            music.play().then(() => {
                isPlaying = true;
                musicBtn.innerHTML = "🎵 <span>Música Sonando</span>";
            }).catch(() => {
                // Autoplay bloqueado por políticas del navegador, el usuario puede usar el botón
                isPlaying = false;
            });
        });

        function toggleMusic() {
            if (isPlaying) {
                music.pause();
                musicBtn.innerHTML = "🔇 <span>Activar Música</span>";
                isPlaying = false;
            } else {
                music.play();
                musicBtn.innerHTML = "🎵 <span>Música Sonando</span>";
                isPlaying = true;
            }
        }

        // Generar partículas fluidas y ligeras (optimizadas para no lagear)
        const particlesContainer = document.getElementById('particles-container');
        const frases = ["Te amo Betzi 🤍", "Te amo Ruth ✨", "Te amo 💖", "Te amo 💫"];
        
        function crearParticula() {
            const p = document.createElement('div');
            p.className = 'particle';
            p.innerText = frases[Math.floor(Math.random() * frases.length)];
            p.style.left = Math.random() * 85 + 'vw';
            p.style.animationDuration = (Math.random() * 3 + 6) + 's'; // Velocidad suave
            p.style.fontSize = (Math.random() * 0.3 + 1) + 'rem';
            particlesContainer.appendChild(p);

            setTimeout(() => {
                p.remove();
            }, 9000);
        }

        // Crear una partícula cada 1.2 segundos para mantener el rendimiento fluido
        setInterval(crearParticula, 1200);
    </script>
</body>
</html>
