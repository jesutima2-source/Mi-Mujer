<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flores Amarillas</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', cursive;
        }

        body {
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            text-align: center;
            padding: 20px;
        }

        /* Fondo con destello sutil romántico */
        body::before {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(255, 230, 0, 0.12) 0%, rgba(10, 43, 233, 0.05) 50%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .contenido-tarjeta {
            position: relative;
            z-index: 10;
            max-width: 380px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .badge-amor {
            font-size: 0.85rem;
            color: #00c3ff;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
            font-weight: 600;
            text-shadow: 0 0 8px rgba(0, 195, 255, 0.4);
        }

        .mensaje-previo {
            color: #ffe600;
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 12px;
            text-shadow: 0 0 12px rgba(255, 230, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.9);
            line-height: 1.35;
        }

        .sub-mensaje {
            color: #cfd8dc;
            font-size: 0.95rem;
            font-weight: 400;
            margin-bottom: 35px;
            line-height: 1.5;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
        }

        .btn-inicio {
            background-color: #0a2be9;
            color: #ffffff;
            padding: 14px 36px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            box-shadow: 0 6px 20px rgba(10, 43, 233, 0.5);
            transition: transform 0.25s ease, background-color 0.25s ease, box-shadow 0.25s ease;
            letter-spacing: 0.8px;
        }

        .btn-inicio:active,
        .btn-inicio:hover {
            background-color: #00c3ff;
            transform: scale(1.06);
            box-shadow: 0 8px 25px rgba(0, 195, 255, 0.6);
        }

        /* Botón opcional para regresar a tarjetas de una vez si lo deseas */
        .regresar-link {
            position: absolute;
            top: 25px;
            left: 25px;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 0.85rem;
            z-index: 20;
            transition: color 0.2s ease;
        }
        .regresar-link:hover {
            color: #fff;
        }
    </style>
</head>
<body>

    <a href="../rincon.html" class="regresar-link">← Volver a tarjetas</a>

    <div class="contenido-tarjeta">
        <div class="badge-amor">Para Betzi 💛</div>
        <div class="mensaje-previo">Algo especial florece para ti...</div>
        <div class="sub-mensaje">Prende el brillo de tus ojos y dale clic al siguiente botón para ver lo que preparamos hoy.</div>
        
        <a href="flower.html" class="btn-inicio">FLORECER ✨</a>
    </div>

</body>
</html>
