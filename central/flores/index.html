<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Betzi ♥</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            text-align: center;
            padding: 20px;
        }

        /* Fondo dinámico respirando */
        body::before {
            content: '';
            position: absolute;
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, rgba(255, 230, 0, 0.18) 0%, rgba(10, 43, 233, 0.1) 55%, transparent 75%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
            animation: respirarGlow 4s ease-in-out infinite;
        }

        @keyframes respirarGlow {
            0%, 100% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.7; }
            50% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
        }

        /* Partículas flotantes */
        .particulas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .particula {
            position: absolute;
            background: #ffe600;
            border-radius: 50%;
            opacity: 0.3;
            animation: flotarParticula linear infinite;
        }

        @keyframes flotarParticula {
            0% { transform: translateY(105vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        @keyframes pop-in {
            0% { transform: scale(0) rotate(180deg); }
            100% { transform: scale(1) rotate(360deg); }
        }

        input[type="radio"] {
            display: none;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        .content {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            width: 100%;
            max-width: 420px;
        }

        .badge-amor {
            font-size: 0.95rem;
            color: #00c3ff;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            margin-bottom: 15px;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(0, 195, 255, 0.5);
        }

        /* Paso 1: Sobre / Botón inicial interactivo */
        .sobre-container {
            width: 100%;
            background: linear-gradient(145deg, #111118, #0a0a0f);
            border: 2px solid rgba(255, 230, 0, 0.4);
            border-radius: 16px;
            padding: 28px 20px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.8), 0 0 20px rgba(255, 230, 0, 0.15);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 22px;
            cursor: pointer;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .sobre-container:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 230, 0, 0.8);
        }

        .sobre-sello {
            font-size: 2.8rem;
            margin-bottom: 12px;
            animation: latirSello 1.5s ease-in-out infinite;
        }

        @keyframes latirSello {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .mensaje-previo {
            color: #fff;
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.35;
        }

        .sub-mensaje {
            color: #cbd5e1;
            font-size: 0.88rem;
            font-weight: 400;
            line-height: 1.4;
        }

        .indicador-abrir {
            margin-top: 14px;
            font-size: 0.78rem;
            color: #00c3ff;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .boton {
            background-color: #0a2be9;
            color: #ffffff;
            padding: 14px 38px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            box-shadow: 0 6px 22px rgba(10, 43, 233, 0.55);
            transition: transform 0.25s ease, background-color 0.25s ease;
            letter-spacing: 1px;
            cursor: pointer;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }

        .boton:hover {
            background-color: #00c3ff;
            transform: scale(1.05);
        }

        /* Paso 2: Carta pequeña interactiva para revelar mensaje final */
        .small-gift-message {
            display: none;
            font-size: 5rem;
            cursor: pointer;
            animation: pop-in 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-bottom: 12px;
        }

        .texto-small-gift-message {
            display: none;
            font-size: 0.95rem;
            color: #00c3ff;
            margin-bottom: 20px;
            font-weight: 600;
        }

        /* Paso 3: Tarjeta de mensaje final + Botón a Flores */
        .mensajeFinal {
            width: 100%;
            background: linear-gradient(145deg, #111118, #0a0a0f);
            border: 2px solid rgba(0, 195, 255, 0.4);
            border-radius: 16px;
            padding: 24px 20px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.8);
            color: #fff;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .textoCarta {
            font-size: 1rem;
            text-align: center;
            line-height: 1.6;
            color: #e2e8f0;
            margin-bottom: 14px;
        }

        .textoPd {
            font-size: 0.88rem;
            color: #ffe600;
            margin-bottom: 22px;
            font-weight: 600;
        }

        .btn-siguiente-seccion {
            background-color: #ffe600;
            color: #000;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(255, 230, 0, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-siguiente-seccion:hover {
            background-color: #fff;
            transform: scale(1.05);
        }

        /* Lógica de radio buttons para transiciones en cascada */
        #paso1:checked ~ .container .paso-1-block { display: block; }
        
        #paso2:checked ~ .container .small-gift-message,
        #paso2:checked ~ .container .texto-small-gift-message { display: block; }

        #paso3:checked ~ .container .mensajeFinal { display: flex; }
    </style>
</head>
<body>

    <!-- Audio de fondo configurado con music1.mp3 -->
    <audio id="musicaFondo" loop>
        <source src="sound/music1.mp3" type="audio/mpeg">
    </audio>

    <!-- Partículas de luz de fondo -->
    <div class="particulas" id="contenedorParticulas"></div>

    <!-- Inputs de control por estados -->
    <input type="radio" name="flujoCarta" id="paso1" checked>
    <input type="radio" name="flujoCarta" id="paso2">
    <input type="radio" name="flujoCarta" id="paso3">

    <div class="container">
        <div class="content">
            <div class="badge-amor">Para Betzi ♥</div>

            <!-- BLOQUE 1: Sobre inicial con frase -->
            <div class="paso-1-block" style="width: 100%;">
                <label for="paso2" class="sobre-container" onclick="tocarMusica()">
                    <div class="sobre-sello">💌</div>
                    <div class="mensaje-previo">Siete años caminando de la mano...</div>
                    <div class="sub-mensaje">y para mí, cada día sigue siendo el reflejo de la alegría que traes a mi vida.</div>
                    <div class="indicador-abrir">Toca para abrir sobre ✨</div>
                </label>
            </div>

            <!-- BLOQUE 2: Icono intermedio para revelar carta final -->
            <label for="paso3" class="small-gift-message" onclick="tocarMusica()">✉️</label>
            <label for="paso3" class="texto-small-gift-message" onclick="tocarMusica()">Te encontraste un sobre ,tocame otra vez :3</label>

            <!-- BLOQUE 3: Mensaje final + Salto a vista de flores -->
            <div class="mensajeFinal" id="blockFinal">
                <span class="textoCarta">
                    Hola, mi amor. Te amo muchísimo.<br>
                    Estoy feliz de que formes parte de mi vida ❤️<br>
                    Cada segundo a tu lado vale oro.
                </span>
                <span class="textoPd">Pd: Estoy muy orgulloso de ti ❤️❤️</span>
                <a href="flower.html" class="btn-siguiente-seccion" onclick="tocarMusica()">Ver Flores Amarillas "♥baja el volumen♥"✨</a>
            </div>
        </div>
    </div>

    <script>
        // Reproducir música al primer toque interactivo
        function tocarMusica() {
            const audio = document.getElementById('musicaFondo');
            if (audio.paused) {
                audio.volume = 0.5;
                audio.play().catch(e => console.log("Audio play waiting interaction", e));
            }
        }

        document.addEventListener('click', tocarMusica, { once: true });

        // Generador dinámico de lucecitas flotantes
        const contenedor = document.getElementById('contenedorParticulas');
        const cantidad = 18;
        for (let i = 0; i < cantidad; i++) {
            const p = document.createElement('div');
            p.classList.add('particula');
            const size = Math.random() * 3 + 1.5;
            p.style.width = `${size}px`;
            p.style.height = `${size}px`;
            p.style.left = `${Math.random() * 100}%`;
            p.style.animationDuration = `${Math.random() * 5 + 4}s`;
            p.style.animationDelay = `${Math.random() * 4}s`;
            if (Math.random() > 0.5) {
                p.style.background = '#00c3ff';
                p.style.boxShadow = '0 0 6px #00c3ff';
            } else {
                p.style.boxShadow = '0 0 6px #ffe600';
            }
            contenedor.appendChild(p);
        }
    </script>
</body>
</html>
