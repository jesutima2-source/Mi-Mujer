<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Betzi ♥</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            position: fixed;
        }

        body {
            background-color: #0b0f19;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 15px;
            color: #fff;
        }

        /* Imagen de fondo */
        .bg-img {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -3;
            animation: zoomFondo 22s infinite alternate linear;
        }

        @keyframes zoomFondo {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        /* Capa translúcida para contraste */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(11, 15, 25, 0.5) 0%, rgba(5, 7, 15, 0.8) 100%);
            z-index: -2;
        }

        /* Canvas para las partículas mágicas */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes pop-in {
            0% { transform: scale(0) rotate(-15deg); opacity: 0; }
            70% { transform: scale(1.08) rotate(5deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        @keyframes latirSello {
            0%, 100% { transform: scale(1); text-shadow: 0 0 15px rgba(255, 230, 0, 0.6); }
            50% { transform: scale(1.2); text-shadow: 0 0 25px rgba(255, 230, 0, 1); }
        }

        @keyframes glowCard {
            0%, 100% { border-color: rgba(255, 230, 0, 0.5); box-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 20px rgba(255, 230, 0, 0.2); }
            50% { border-color: rgba(0, 195, 255, 0.8); box-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 30px rgba(0, 195, 255, 0.4); }
        }

        input[type="radio"] {
            display: none;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        .content {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            width: 100%;
            max-width: 390px;
        }

        .badge-amor {
            font-size: 0.95rem;
            color: #00c3ff;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 14px;
            font-weight: 800;
            text-shadow: 0 0 12px rgba(0, 195, 255, 0.8);
        }

        /* Paso 1: Sobre / Botón inicial */
        .sobre-container {
            width: 100%;
            background: rgba(18, 20, 32, 0.85);
            border: 2px solid rgba(255, 230, 0, 0.5);
            border-radius: 18px;
            padding: 24px 18px;
            animation: glowCard 4s infinite ease-in-out, pop-in 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: transform 0.2s ease;
        }

        .sobre-container:active {
            transform: scale(0.96);
        }

        .sobre-sello {
            font-size: 2.8rem;
            margin-bottom: 10px;
            animation: latirSello 1.6s ease-in-out infinite;
        }

        .mensaje-previo {
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.35;
        }

        .sub-mensaje {
            color: #e2e8f0;
            font-size: 0.85rem;
            font-weight: 400;
            line-height: 1.4;
        }

        .indicador-abrir {
            margin-top: 12px;
            font-size: 0.75rem;
            color: #ffe600;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Paso 2: Carta pequeña intermedia */
        .small-gift-message {
            display: none;
            font-size: 4.5rem;
            cursor: pointer;
            animation: pop-in 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275), latirSello 2s infinite ease-in-out;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 15px rgba(255, 230, 0, 0.6));
        }

        .texto-small-gift-message {
            display: none;
            font-size: 0.9rem;
            color: #00c3ff;
            margin-bottom: 15px;
            font-weight: 700;
        }

        /* Paso 3: Tarjeta de mensaje final */
        .mensajeFinal {
            width: 100%;
            background: rgba(18, 20, 32, 0.9);
            border: 2px solid rgba(0, 195, 255, 0.6);
            border-radius: 18px;
            padding: 22px 18px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 25px rgba(0, 195, 255, 0.3);
            color: #fff;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
            animation: pop-in 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .textoCarta {
            font-size: 0.95rem;
            text-align: center;
            line-height: 1.55;
            color: #f1f5f9;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .textoPd {
            font-size: 0.85rem;
            color: #ffe600;
            margin-bottom: 18px;
            font-weight: 700;
        }

        .btn-siguiente-seccion {
            background: linear-gradient(135deg, #ffe600, #ff9900);
            color: #000;
            padding: 11px 26px;
            border-radius: 24px;
            text-decoration: none;
            font-weight: 800;
            font-size: 0.85rem;
            box-shadow: 0 5px 15px rgba(255, 230, 0, 0.5);
        }

        /* Control de estados por radio buttons */
        #paso1:checked ~ .container .paso-1-block { display: block; }
        #paso2:checked ~ .container .small-gift-message,
        #paso2:checked ~ .container .texto-small-gift-message { display: block; }
        #paso3:checked ~ .container .mensajeFinal { display: flex; }
    </style>
</head>
<body>

    <!-- Imagen de fondo Galaxia con respaldo -->
    <img src="img/cartas.jpg" onerror="this.onerror=null; this.src='cartas.jpg'; this.onerror=function(){this.src='central/flores/img/galaxia.jpeg'};" class="bg-img" alt="Fondo Galaxia">
    <div class="bg-overlay"></div>

    <!-- Canvas para las partículas flotantes -->
    <canvas id="particles-canvas"></canvas>

    <!-- Audio con reproducción automática -->
    <audio id="musicaFondo" src="sound/music1.mp3" preload="auto" autoplay loop></audio>

    <input type="radio" name="flujoCarta" id="paso1" checked>
    <input type="radio" name="flujoCarta" id="paso2">
    <input type="radio" name="flujoCarta" id="paso3">

    <div class="container">
        <div class="content">
            <div class="badge-amor">Para Betzi ♥</div>

            <!-- BLOQUE 1 -->
            <div class="paso-1-block" style="width: 100%;">
                <label for="paso2" class="sobre-container">
                    <div class="sobre-sello">💌</div>
                    <div class="mensaje-previo">Siete años caminando de la mano...</div>
                    <div class="sub-mensaje">y para mí, cada día sigue siendo el reflejo de la alegría que traes a mi vida.</div>
                    <div class="indicador-abrir">Toca para abrir sobre ✨</div>
                </label>
            </div>

            <!-- BLOQUE 2 -->
            <label for="paso3" class="small-gift-message">✉️</label>
            <label for="paso3" class="texto-small-gift-message">Te encontraste un sobre, tócame otra vez :3</label>

            <!-- BLOQUE 3 -->
            <div class="mensajeFinal" id="blockFinal">
                <span class="textoCarta">
                    Hola, mi amor. Te amo muchísimo.<br>
                    Estoy feliz de que formes parte de mi vida ❤️<br>
                    Cada segundo a tu lado vale oro.
                </span>
                <span class="textoPd">Pd: Estoy muy orgulloso de ti ❤️❤️</span>
                <a href="flower.html" class="btn-siguiente-seccion">Ver Flores Amarillas "♥ baja el volumen ♥" ✨</a>
            </div>
        </div>
    </div>

    <script>
        const audio = document.getElementById('musicaFondo');
        audio.volume = 0.5;

        window.addEventListener('DOMContentLoaded', () => {
            audio.play().catch(error => {
                console.log("Reproducción automática restringida inicialmente por el navegador:", error);
            });
        });

        // Script de partículas flotantes (estrellas/destellos dinámicos)
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');

        let particlesArray = [];
        const numberOfParticles = 45;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.5 + 0.8;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.speedY = (Math.random() - 0.5) * 0.4 - 0.2; // Tienden a subir ligeramente
                this.color = Math.random() > 0.5 ? 'rgba(255, 230, 0, ' : 'rgba(0, 195, 255, ';
                this.alpha = Math.random() * 0.7 + 0.3;
                this.alphaSpeed = (Math.random() * 0.02 + 0.005) * (Math.random() > 0.5 ? 1 : -1);
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                // Efecto parpadeo suave
                this.alpha += this.alphaSpeed;
                if (this.alpha > 0.9 || this.alpha < 0.2) {
                    this.alphaSpeed = -this.alphaSpeed;
                }

                // Reaparecer si salen de la pantalla
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color + this.alpha + ')';
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color + '1)';
                ctx.fill();
            }
        }

        function initParticles() {
            particlesArray = [];
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach(particle => {
                particle.update();
                particle.draw();
            });
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();
    </script>
</body>
</html>
