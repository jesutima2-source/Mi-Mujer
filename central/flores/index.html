<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flores Amarillas</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', cursive;
        }

        body {
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            text-align: center;
            padding: 20px;
        }

        /* Fondo dinámico con brillo central respirando */
        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 230, 0, 0.16) 0%, rgba(10, 43, 233, 0.08) 55%, transparent 75%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
            animation: respirarGlow 4s ease-in-out infinite;
        }

        @keyframes respirarGlow {
            0%, 100% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.7; }
            50% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
        }

        /* Contenedor de partículas/estrellas flotantes */
        .particulas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .particula {
            position: absolute;
            background: #ffe600;
            border-radius: 50%;
            opacity: 0.3;
            animation: flotarParticula linear infinite;
        }

        @keyframes flotarParticula {
            0% { transform: translateY(105vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        .contenido-tarjeta {
            position: relative;
            z-index: 10;
            max-width: 380px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: entradaSuave 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes entradaSuave {
            from { opacity: 0; transform: translateY(20px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .badge-amor {
            font-size: 0.85rem;
            color: #00c3ff;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            margin-bottom: 12px;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(0, 195, 255, 0.5);
        }

        .mensaje-previo {
            color: #ffe600;
            font-size: 1.45rem;
            font-weight: 700;
            margin-bottom: 12px;
            text-shadow: 0 0 14px rgba(255, 230, 0, 0.6), 0 2px 6px rgba(0, 0, 0, 0.9);
            line-height: 1.35;
        }

        .sub-mensaje {
            color: #cfd8dc;
            font-size: 0.95rem;
            font-weight: 400;
            margin-bottom: 35px;
            line-height: 1.5;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
        }

        .btn-inicio {
            background-color: #0a2be9;
            color: #ffffff;
            padding: 15px 40px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            box-shadow: 0 6px 22px rgba(10, 43, 233, 0.55);
            transition: transform 0.25s ease, background-color 0.25s ease, box-shadow 0.25s ease;
            letter-spacing: 1px;
        }

        .btn-inicio:active,
        .btn-inicio:hover {
            background-color: #00c3ff;
            transform: scale(1.06);
            box-shadow: 0 8px 28px rgba(0, 195, 255, 0.7);
        }
    </style>
</head>
<body>

    <!-- Capa de partículas de luz sutiles -->
    <div class="particulas" id="contenedorParticulas"></div>

  <div class="contenido-tarjeta">
    <div class="badge-amor">Para Betzi ♥</div>
    <div class="mensaje-previo">Siete años caminando de la mano...</div>
    <div class="sub-mensaje">y para mí, cada día sigue siendo el reflejo de la alegría que traes a mi vida. Prende el brillo de tus ojos y florece.</div>
    
    <a href="flower.html" class="btn-inicio">FLORECER ✨</a>
</div>

    <script>
        // Generador dinámico de lucecitas flotantes de fondo
        const contenedor = document.getElementById('contenedorParticulas');
        const cantidad = 18;
        for (let i = 0; i < cantidad; i++) {
            const p = document.createElement('div');
            p.classList.add('particula');
            const size = Math.random() * 3 + 1.5;
            p.style.width = `${size}px`;
            p.style.height = `${size}px`;
            p.style.left = `${Math.random() * 100}%`;
            p.style.animationDuration = `${Math.random() * 5 + 4}s`;
            p.style.animationDelay = `${Math.random() * 4}s`;
            if (Math.random() > 0.5) {
                p.style.background = '#00c3ff';
                p.style.boxShadow = '0 0 6px #00c3ff';
            } else {
                p.style.boxShadow = '0 0 6px #ffe600';
            }
            contenedor.appendChild(p);
        }
    </script>
</body>
</html>
