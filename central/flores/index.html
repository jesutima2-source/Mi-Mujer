<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Betzi ♥</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            position: fixed;
        }

        body {
            background-color: #05070f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 15px;
            color: #fff;
        }

        /* Imagen de fondo garantizada para celular mediante etiqueta HTML */
        .bg-img {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        /* Capa oscura translúcida para que resalte el texto */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 7, 15, 0.72);
            z-index: -1;
        }

        /* Partículas flotantes */
        .particulas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .particula {
            position: absolute;
            background: #ffe600;
            border-radius: 50%;
            opacity: 0.3;
            animation: flotarParticula linear infinite;
        }

        @keyframes flotarParticula {
            0% { transform: translateY(105vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        @keyframes pop-in {
            0% { transform: scale(0) rotate(180deg); }
            100% { transform: scale(1) rotate(360deg); }
        }

        input[type="radio"] {
            display: none;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        .content {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            width: 100%;
            max-width: 390px;
        }

        .badge-amor {
            font-size: 0.9rem;
            color: #00c3ff;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(0, 195, 255, 0.5);
        }

        /* Paso 1: Sobre / Botón inicial interactivo */
        .sobre-container {
            width: 100%;
            background: rgba(17, 17, 24, 0.88);
            border: 2px solid rgba(255, 230, 0, 0.4);
            border-radius: 14px;
            padding: 22px 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8), 0 0 15px rgba(255, 230, 0, 0.15);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
            backdrop-filter: blur(6px);
        }

        .sobre-container:active {
            transform: scale(0.97);
            border-color: rgba(255, 230, 0, 0.9);
        }

        .sobre-sello {
            font-size: 2.4rem;
            margin-bottom: 8px;
            animation: latirSello 1.5s ease-in-out infinite;
        }

        @keyframes latirSello {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .mensaje-previo {
            color: #fff;
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 6px;
            line-height: 1.3;
        }

        .sub-mensaje {
            color: #cbd5e1;
            font-size: 0.82rem;
            font-weight: 400;
            line-height: 1.35;
        }

        .indicador-abrir {
            margin-top: 10px;
            font-size: 0.72rem;
            color: #00c3ff;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Paso 2: Carta pequeña interactiva para revelar mensaje final */
        .small-gift-message {
            display: none;
            font-size: 4.2rem;
            cursor: pointer;
            animation: pop-in 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-bottom: 10px;
        }

        .texto-small-gift-message {
            display: none;
            font-size: 0.88rem;
            color: #00c3ff;
            margin-bottom: 15px;
            font-weight: 600;
        }

        /* Paso 3: Tarjeta de mensaje final + Botón a Flores */
        .mensajeFinal {
            width: 100%;
            background: rgba(17, 17, 24, 0.92);
            border: 2px solid rgba(0, 195, 255, 0.4);
            border-radius: 14px;
            padding: 20px 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            color: #fff;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(6px);
        }

        .textoCarta {
            font-size: 0.92rem;
            text-align: center;
            line-height: 1.5;
            color: #e2e8f0;
            margin-bottom: 10px;
        }

        .textoPd {
            font-size: 0.82rem;
            color: #ffe600;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .btn-siguiente-seccion {
            background-color: #ffe600;
            color: #000;
            padding: 10px 24px;
            border-radius: 22px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.82rem;
            box-shadow: 0 4px 12px rgba(255, 230, 0, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-siguiente-seccion:active {
            transform: scale(0.95);
            background-color: #fff;
        }

        /* Lógica de radio buttons para transiciones en cascada */
        #paso1:checked ~ .container .paso-1-block { display: block; }
        
        #paso2:checked ~ .container .small-gift-message,
        #paso2:checked ~ .container .texto-small-gift-message { display: block; }

        #paso3:checked ~ .container .mensajeFinal { display: flex; }
    </style>
</head>
<body>

    <!-- Imagen de fondo directa para asegurar visibilidad en celulares -->
    <img src="central/flores/img/cartas.jpg" class="bg-img" alt="Fondo">
    <div class="bg-overlay"></div>

    <!-- Audio de fondo -->
    <audio id="musicaFondo" src="central/flores/sound/music1.mp3" preload="auto" loop></audio>

    <!-- Partículas de luz de fondo -->
    <div class="particulas" id="contenedorParticulas"></div>

    <!-- Inputs de control por estados -->
    <input type="radio" name="flujoCarta" id="paso1" checked>
    <input type="radio" name="flujoCarta" id="paso2">
    <input type="radio" name="flujoCarta" id="paso3">

    <div class="container">
        <div class="content">
            <div class="badge-amor">Para Betzi ♥</div>

            <!-- BLOQUE 1: Sobre inicial con frase -->
            <div class="paso-1-block" style="width: 100%;">
                <label for="paso2" class="sobre-container" id="btnIniciar">
                    <div class="sobre-sello">💌</div>
                    <div class="mensaje-previo">Siete años caminando de la mano...</div>
                    <div class="sub-mensaje">y para mí, cada día sigue siendo el reflejo de la alegría que traes a mi vida.</div>
                    <div class="indicador-abrir">Toca para abrir sobre ✨</div>
                </label>
            </div>

            <!-- BLOQUE 2: Icono intermedio para revelar carta final -->
            <label for="paso3" class="small-gift-message">✉️</label>
            <label for="paso3" class="texto-small-gift-message">Te encontraste un sobre, tócame otra vez :3</label>

            <!-- BLOQUE 3: Mensaje final + Salto a vista de flores -->
            <div class="mensajeFinal" id="blockFinal">
                <span class="textoCarta">
                    Hola, mi amor. Te amo muchísimo.<br>
                    Estoy feliz de que formes parte de mi vida ❤️<br>
                    Cada segundo a tu lado vale oro.
                </span>
                <span class="textoPd">Pd: Estoy muy orgulloso de ti ❤️❤️</span>
                <a href="flower.html" class="btn-siguiente-seccion">Ver Flores Amarillas "♥ baja el volumen ♥" ✨</a>
            </div>
        </div>
    </div>

    <script>
        const audio = document.getElementById('musicaFondo');
        audio.volume = 0.5;

        // Función para reproducir y saltar los 3 segundos de silencio en el primer toque
        function iniciarAudio() {
            audio.currentTime = 3.0; // Salta el silencio de golpe
            audio.play().then(() => {
                // Si ya arrancó con éxito, removemos los escuchas para que no se reinicie
                document.removeEventListener('click', iniciarAudio);
                document.removeEventListener('touchstart', iniciarAudio);
            }).catch(e => console.log(e));
        }

        // Registrar eventos táctiles para activar el audio al primer toque en cualquier parte del celular
        document.addEventListener('click', iniciarAudio);
        document.addEventListener('touchstart', iniciarAudio);

        // Generador dinámico de lucecitas flotantes
        const contenedor = document.getElementById('contenedorParticulas');
        const cantidad = 16;
        for (let i = 0; i < cantidad; i++) {
            const p = document.createElement('div');
            p.classList.add('particula');
            const size = Math.random() * 3 + 1.5;
            p.style.width = `${size}px`;
            p.style.height = `${size}px`;
            p.style.left = `${Math.random() * 100}%`;
            p.style.animationDuration = `${Math.random() * 5 + 4}s`;
            p.style.animationDelay = `${Math.random() * 4}s`;
            if (Math.random() > 0.5) {
                p.style.background = '#00c3ff';
                p.style.boxShadow = '0 0 6px #00c3ff';
            } else {
                p.style.boxShadow = '0 0 6px #ffe600';
            }
            contenedor.appendChild(p);
        }
    </script>
</body>
</html>
