<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flores Amarillas</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', cursive;
        }

        body {
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            text-align: center;
            padding: 20px;
        }

        /* Fondo dinámico con brillo central respirando */
        body::before {
            content: '';
            position: absolute;
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, rgba(255, 230, 0, 0.18) 0%, rgba(10, 43, 233, 0.1) 55%, transparent 75%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
            animation: respirarGlow 4s ease-in-out infinite;
        }

        @keyframes respirarGlow {
            0%, 100% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.7; }
            50% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
        }

        /* Contenedor de partículas/estrellas flotantes */
        .particulas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .particula {
            position: absolute;
            background: #ffe600;
            border-radius: 50%;
            opacity: 0.3;
            animation: flotarParticula linear infinite;
        }

        @keyframes flotarParticula {
            0% { transform: translateY(105vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        .contenido-tarjeta {
            position: relative;
            z-index: 10;
            max-width: 420px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: entradaSuave 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes entradaSuave {
            from { opacity: 0; transform: translateY(20px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .badge-amor {
            font-size: 0.95rem;
            color: #00c3ff;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            margin-bottom: 10px;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(0, 195, 255, 0.5);
        }

        /* Estilo del sobre interactivo tipo carta */
        .sobre-container {
            width: 320px;
            height: 220px;
            background: #fdfaf6;
            border-radius: 12px;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 20px rgba(255, 230, 0, 0.15);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px;
            margin-bottom: 25px;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid rgba(255, 230, 0, 0.4);
        }

        .sobre-container:hover {
            transform: scale(1.03) translateY(-5px);
        }

        .sobre-sello {
            font-size: 2.2rem;
            margin-bottom: 12px;
            animation: latirSello 1.5s ease-in-out infinite;
        }

        @keyframes latirSello {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .mensaje-previo {
            color: #1a1a1a;
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.35;
        }

        .sub-mensaje {
            color: #4a5568;
            font-size: 0.88rem;
            font-weight: 500;
            line-height: 1.4;
        }

        .indicador-abrir {
            margin-top: 10px;
            font-size: 0.75rem;
            color: #0a2be9;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .btn-inicio {
            background-color: #0a2be9;
            color: #ffffff;
            padding: 15px 42px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            box-shadow: 0 6px 22px rgba(10, 43, 233, 0.55);
            transition: transform 0.25s ease, background-color 0.25s ease, box-shadow 0.25s ease;
            letter-spacing: 1px;
            display: inline-block;
        }

        .btn-inicio:active,
        .btn-inicio:hover {
            background-color: #00c3ff;
            transform: scale(1.06);
            box-shadow: 0 8px 28px rgba(0, 195, 255, 0.7);
        }
    </style>
</head>
<body>

    <!-- Audio de fondo -->
    <audio id="musicaFondo" loop>
        <source src="sound/music1.mp3" type="audio/mpeg">
    </audio>

    <!-- Capa de partículas de luz sutiles -->
    <div class="particulas" id="contenedorParticulas"></div>

    <div class="contenido-tarjeta">
        <div class="badge-amor">Para Betzi 💛</div>

        <!-- Sobre interactivo con tu frase -->
        <div class="sobre-container" id="sobreCarta" onclick="tocarMusica()">
            <div class="sobre-sello">💌</div>
            <div class="mensaje-previo">Siete años caminando de la mano...</div>
            <div class="sub-mensaje">y para mí, cada día sigue siendo el reflejo de la alegría que traes a mi vida.</div>
            <div class="indicador-abrir">Toca para abrir audio y continuar ✨</div>
        </div>
        
        <a href="flower.html" class="btn-inicio" onclick="tocarMusica()">FLORECER ✨</a>
    </div>

    <script>
        // Reproducir música al interactuar con el sobre o el botón
        function tocarMusica() {
            const audio = document.getElementById('musicaFondo');
            if (audio.paused) {
                audio.volume = 0.5;
                audio.play().catch(e => console.log("Audio play prevented or waiting for interaction", e));
            }
        }

        // Intento de autoplay al primer toque en cualquier parte de la pantalla
        document.addEventListener('click', tocarMusica, { once: true });

        // Generador dinámico de lucecitas flotantes de fondo
        const contenedor = document.getElementById('contenedorParticulas');
        const cantidad = 18;
        for (let i = 0; i < cantidad; i++) {
            const p = document.createElement('div');
            p.classList.add('particula');
            const size = Math.random() * 3 + 1.5;
            p.style.width = `${size}px`;
            p.style.height = `${size}px`;
            p.style.left = `${Math.random() * 100}%`;
            p.style.animationDuration = `${Math.random() * 5 + 4}s`;
            p.style.animationDelay = `${Math.random() * 4}s`;
            if (Math.random() > 0.5) {
                p.style.background = '#00c3ff';
                p.style.boxShadow = '0 0 6px #00c3ff';
            } else {
                p.style.boxShadow = '0 0 6px #ffe600';
            }
            contenedor.appendChild(p);
        }
    </script>
</body>
</html>
