<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flores Amarillas</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .mensaje-previo {
            color: #ffe600;
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 35px;
            text-shadow: 0 0 10px rgba(255, 230, 0, 0.4);
            line-height: 1.4;
            max-width: 350px;
        }

        .btn-inicio {
            background-color: #0a2be9;
            color: #ffffff;
            padding: 14px 32px;
            border-radius: 25px;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(10, 43, 233, 0.5);
            transition: transform 0.2s ease, background-color 0.2s ease;
            letter-spacing: 1px;
        }

        .btn-inicio:active,
        .btn-inicio:hover {
            background-color: #00c3ff;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="mensaje-previo">
        Presiona el botón para abrir tu regalo 💛
    </div>

    <a href="flower.html" class="btn-inicio">CLICK AQUÍ</a>

</body>
</html>
