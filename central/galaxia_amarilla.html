<style>
  html, body { 
    margin: 0; 
    padding: 0;
    width: 100%;
    height: 100%; 
    background: #050b14; 
    overflow: hidden; 
    position: fixed;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
  }
  
  canvas { 
    display: block; 
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw !important;
    height: 100vh !important;
    touch-action: none; 
  }

  /* --- Botón para volver al inicio --- */
  .btn-inicio {
    position: fixed;
    top: 20px;
    left: 20px;
    padding: 10px 20px;
    background: rgba(0, 20, 40, 0.7);
    border: 2px solid #ff8800;
    border-radius: 999px;
    color: #fff;
    font-size: 14px;
    text-decoration: none;
    box-shadow: 0 0 12px #ff8800;
    z-index: 1000;
    transition: transform 0.2s, background 0.2s;
  }
  .btn-inicio:hover {
    transform: scale(1.05);
    background: rgba(255, 136, 0, 0.3);
  }

  /* --- Barra de Reproducción Inferior --- */
  .player-bar {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 450px;
    background: rgba(5, 11, 20, 0.85);
    border: 2px solid rgba(255, 136, 0, 0.6);
    border-radius: 999px;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 15px;
    box-shadow: 0 0 20px rgba(255, 136, 0, 0.4);
    z-index: 1000;
    backdrop-filter: blur(8px);
  }

  .play-btn {
    background: none;
    border: none;
    color: #ffaa00;
    font-size: 22px;
    cursor: pointer;
    transition: transform 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .play-btn:hover {
    transform: scale(1.15);
  }

  .song-info {
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 90px;
  }

  .progress-container {
    flex-grow: 1;
    background: rgba(255, 255, 255, 0.15);
    height: 6px;
    border-radius: 3px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #ff8800, #00d2ff);
    width: 0%;
    border-radius: 3px;
  }

  .time-display {
    color: #ccc;
    font-size: 11px;
    min-width: 65px;
    text-align: right;
  }

<div class="player-bar">
  <button class="play-btn" id="playBtn" title="Reproducir / Pausa">⏸</button>
  <div class="song-info">Te Amo Betzi</div>
  <div class="progress-container" id="progressContainer">
    <div class="progress-bar" id="progressBar"></div>

<script>
// ================= Audio y Controles de la Barra =================
const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
const progressBar = document.getElementById('progressBar');
const progressContainer = document.getElementById('progressContainer');
const timeDisplay = document.getElementById('timeDisplay');

audio.volume = 1.0;

window.addEventListener('DOMContentLoaded', () => {
  audio.play().then(() => {
    playBtn.textContent = '⏸';
  }).catch(() => {
    const unlockAudio = () => {
      audio.play();
      playBtn.textContent = '⏸';
      window.removeEventListener('click', unlockAudio);
      window.removeEventListener('touchstart', unlockAudio);
    };
    window.addEventListener('click', unlockAudio);
    window.addEventListener('touchstart', unlockAudio);
  });
});

playBtn.addEventListener('click', () => {
  if (audio.paused) {
    audio.play();
    playBtn.textContent = '⏸';
  } else {
    audio.pause();
    playBtn.textContent = '▶';
  }
});

audio.addEventListener('timeupdate', () => {
  if (audio.duration) {
    const percent = (audio.currentTime / audio.duration) * 100;
    progressBar.style.width = percent + '%';
    timeDisplay.textContent = formatTime(audio.currentTime) + ' / ' + formatTime(audio.duration);
  }
});

progressContainer.addEventListener('click', (e) => {
  const rect = progressContainer.getBoundingClientRect();
  const pos = (e.clientX - rect.left) / rect.width;
  audio.currentTime = pos * audio.duration;
});

function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return m + ':' + (s < 10 ? '0' : '') + s;
}

// ================= Escena 3D =================
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.setSize(innerWidth, innerHeight);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 5000);

let targetDist = 180, currentDist = 180, rotX = 0.2, rotY = 0;

scene.background = new THREE.Color(0x050b14);

// Estrellas de fondo
(function makeStars(count=2500, spread=3200){
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(count*3);
  for(let i=0; i<count; i++){
    const r = spread * (0.3 + Math.random()*0.7);
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    pos[i*3+0] = r * Math.sin(ph) * Math.cos(th);
    pos[i*3+1] = r * Math.cos(ph);
    pos[i*3+2] = r * Math.sin(ph) * Math.sin(th);
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({size:3.5, color:0xffffff, depthWrite:false, transparent:true, opacity:0.95})));
})();

// Halo de luz naranja/blanco brillante envolvente (fijo, sin parpadear)
function makeGlow(size=1024, c1='255,160,50', c2='255,255,255'){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  g.clearRect(0, 0, size, size);
  const grad = g.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  grad.addColorStop(0, 'rgba('+c1+',0.95)');
  grad.addColorStop(0.4, 'rgba('+c2+',0.6)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad; 
  g.beginPath();
  g.arc(size/2, size/2, size/2, 0, Math.PI * 2);
  g.fill();
  return new THREE.CanvasTexture(c);
}

const glow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: makeGlow(), 
  transparent: true, 
  depthWrite: false,
  blending: THREE.AdditiveBlending 
}));
glow.scale.set(580, 580, 1);
scene.add(glow);

function ringTexture(size=768){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); g.translate(size/2, size/2);
  const r1 = size*0.34, r2 = size*0.49;
  const grd = g.createRadialGradient(0,0,r1*0.3,0,0,r2);
  grd.addColorStop(0.0,'rgba(0,210,255,1)');
  grd.addColorStop(0.3,'rgba(255,136,0,0.9)');
  grd.addColorStop(0.65,'rgba(0,210,255,0.7)');
  grd.addColorStop(1.0,'rgba(0,0,0,0)');
  g.fillStyle = grd;
  g.beginPath(); g.arc(0,0,r2,0,Math.PI*2); g.arc(0,0,r1,0,Math.PI*2,true); g.closePath(); g.fill();
  return new THREE.CanvasTexture(c);
}

function makeTextTexture(text, color, isLarge){
  const c = document.createElement('canvas'); c.width = 512; c.height = 128;
  const ctx = c.getContext('2d'); ctx.clearRect(0,0,c.width,c.height);
  ctx.font = (isLarge ? 'bold 64px' : 'bold 50px') + ' "Segoe UI", Roboto, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffffff'; ctx.shadowColor = color; ctx.shadowBlur = 35;
  ctx.fillText(text, c.width/2, c.height/2);
  return new THREE.CanvasTexture(c);
}
const COLORS = ['#00d2ff', '#ff9933', '#38bdf8', '#ffbb33', '#70d6ff', '#ff8800', '#ffa500', '#ff66b2'];
const textGroup = new THREE.Group(); scene.add(textGroup);

const totalWords = 85;
const wordSpeed = 0.0009;

for(let i=0; i<totalWords; i++){
  const word = WORDS[i % WORDS.length];
  const color = COLORS[i % COLORS.length];
  const isLarge = (i % 6 === 0);
  const tex = makeTextTexture(word, color, isLarge);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true}));
  const scaleX = isLarge ? 80 : 62;
  const scaleY = isLarge ? 22 : 17;
  sp.scale.set(scaleX, scaleY, 1);

  const phi = Math.acos(1 - 2 * (i + 0.5) / totalWords);
  const theta = Math.PI * (1 + Math.sqrt(5)) * i;
  const radius = 110 + (i % 5) * 16;

  sp.position.set(radius * Math.sin(phi) * Math.cos(theta), radius * Math.cos(phi), radius * Math.sin(phi) * Math.sin(theta));
  sp.userData = { phi, theta, radius, speed: wordSpeed };
  textGroup.add(sp);
}

// ================= Ramos 360 de Flores =================
const addedBouquets = (()=>{
  function makeGeometry(){
    let data=[];const PI=Math.PI,TAU=2*PI;let seed=13;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}const add=(a,b)=>a.map((v,i)=>v+b[i]),sub=(a,b)=>a.map((v,i)=>v-b[i]),mul=(a,k)=>a.map(v=>v*k),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],norm=a=>mul(a,1/(Math.hypot(...a)||1));

      for(const f of [[0,1,2],[0,2,3],[0,3,1],[1,3,2]])tri(points[f[0]],points[f[1]],points[f[2]],color);

    for(let i=0;i<37;i++){let a=i*2.4,r=.6+rand()*.85;let end=[Math.cos(a)*r,.35+rand()*1.4,Math.sin(a)*r*.65];stem([.06*Math.cos(a),-2.65,.06*Math.sin(a)],end,.023,[.22,.35,.10]);let base=mul(end,.7);base[1]-=.1;leaf(base,add(end,[Math.cos(a)*.25,.25,Math.sin(a)*.17]),.19+rand()*.13)}

      stem([0,-1.6,0],center,.036,[.23,.37,.085]);

      for(let layer=0;layer<2;layer++)for(let i=0;i<26;i++){let angle=i/26*TAU+layer*.12+(rand()-.5)*.065,len=size*(.45+rand()*.17),width=size*(.073+rand()*.029),curl=(rand()-.3)*.18;patch((t,s)=>{let lateral=s*2-1,r=.24*size+t*len;let edge=Math.pow(Math.sin(PI*t),.72)*width*lateral;let x=Math.cos(angle)*r-Math.sin(angle)*edge,y=Math.sin(angle)*r+Math.cos(angle)*edge;let z=size*(.035+layer*.055+.16*Math.sin(PI*t)-.08*t)+curl*t*t+.044*lateral*lateral*Math.sin(PI*t);return pt(x,y,z)},10,5,(t,s)=>[1,.56+.27*t+.04*Math.sin(s*PI),.018+.035*t])}

    for(let sign of [-1,1])patch((t,v)=>[sign*(.10+.36*t+.09*Math.sin(t*5))+(v-.5)*(.19+.06*t),-1.70-.83*t,.33+.12*Math.sin(t*7)+v*.03],24,5,[1,.73,.035]);ball([0,-1.62,.40],.16,[1,.72,.025],[1,.77,.70],18);

// ================= Controles de Cámara Avanzados para Celular y PC =================
let dragging = false, lastX = 0, lastY = 0;
let initialPinchDist = null;

function onDown(e){
  if(e.target.closest('.player-bar') || e.target.closest('.btn-inicio')) return;

  if (e.touches && e.touches.length === 2) {
    initialPinchDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    dragging = false;
    return;
  }

  dragging = true; 
  const t = e.touches ? e.touches[0] : e; 
  lastX = t.clientX; 
  lastY = t.clientY; 
}

function onMove(e){
  if (e.touches && e.touches.length === 2 && initialPinchDist !== null) {
    const currentPinchDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    const diff = initialPinchDist - currentPinchDist;
    targetDist += diff * 0.5;
    targetDist = Math.max(40, Math.min(450, targetDist));
    initialPinchDist = currentPinchDist;
    return;
  }

  if(!dragging) return;
  const t = e.touches ? e.touches[0] : e;
  rotY -= (t.clientX - lastX) / innerWidth * 3;
  rotX = Math.max(-1.2, Math.min(1.2, rotX - (t.clientY - lastY) / innerHeight * 2.2));
  lastX = t.clientX; 
  lastY = t.clientY;
}

function onUp(){ 
  dragging = false; 
  initialPinchDist = null;
}

addEventListener('mousedown', onDown); 
addEventListener('mousemove', onMove); 
addEventListener('mouseup', onUp);

addEventListener('touchstart', onDown, {passive: true}); 
addEventListener('touchmove', onMove, {passive: true}); 
addEventListener('touchend', onUp, {passive: true});

addEventListener('wheel', (e)=>{ 
  targetDist += e.deltaY * 0.25; 
  targetDist = Math.max(40, Math.min(450, targetDist)); 
}, {passive:true});

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ================= Bucle de Animación =================
let t = 0;
function tick(){
  requestAnimationFrame(tick);
  t += 0.015;

  ring1.rotation.z += 0.003;
  ring2.rotation.z -= 0.002;
  
  // Halo firme y constante (sin parpadeos de tamaño molestos)
  glow.scale.set(580, 580, 1);

  textGroup.children.forEach(sp => {
    sp.material.opacity = 0.75 + 0.25 * Math.sin(t * 2);
    sp.userData.theta += sp.userData.speed;
    const { radius, phi, theta } = sp.userData;
    sp.position.x = radius * Math.sin(phi) * Math.cos(theta);
    sp.position.z = radius * Math.sin(phi) * Math.sin(theta);
  });

  addedBouquets.children.forEach(mesh => {
    mesh.userData.theta += mesh.userData.speed;
    const { radius, phi, theta } = mesh.userData;

    const x = radius * Math.sin(phi) * Math.cos(theta);
    const y = radius * Math.cos(phi);
    const z = radius * Math.sin(phi) * Math.sin(theta);

    mesh.position.set(x, y, z);
    mesh.rotation.y = theta;
  });

  currentDist += (targetDist - currentDist) * 0.08;
  const cx = Math.cos(rotX), sx = Math.sin(rotX);
  const cy = Math.cos(rotY), sy = Math.sin(rotY);
  camera.position.set(currentDist * sy * cx, currentDist * sx, currentDist * cy * cx);
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
}
tick();
</script>
