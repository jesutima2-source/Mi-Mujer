<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Un Rincón Especial ♥</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #05070f;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      padding: 20px;
      text-align: center;
    }

    /* TÍTULO ANIMADO BIENVENIDA */
    .greetings {
      font-size: 3rem;
      font-weight: 800;
      display: flex;
      gap: 6px;
      margin-bottom: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .greetings span {
      animation: glow 2s ease-in-out infinite alternate;
      color: #444;
    }

    .greetings span:nth-child(1) { animation-delay: 0.1s; }
    .greetings span:nth-child(2) { animation-delay: 0.2s; }
    .greetings span:nth-child(3) { animation-delay: 0.3s; }
    .greetings span:nth-child(4) { animation-delay: 0.4s; }
    .greetings span:nth-child(5) { animation-delay: 0.5s; }
    .greetings span:nth-child(6) { animation-delay: 0.6s; }
    .greetings span:nth-child(7) { animation-delay: 0.7s; }
    .greetings span:nth-child(8) { animation-delay: 0.8s; }
    .greetings span:nth-child(9) { animation-delay: 0.9s; }
    .greetings span:nth-child(10) { animation-delay: 1.0s; }

    @keyframes glow {
      0% {
        color: #333;
        text-shadow: none;
      }
      100% {
        color: #fff;
        text-shadow: 0 0 15px #00f0ff, 0 0 30px #00f0ff;
      }
    }

    /* SUBTÍTULO Y FRASE */
    .description {
      font-size: 1.1rem;
      letter-spacing: 1.5px;
      color: #e0f8ff;
      margin-bottom: 40px;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
    }

    /* CONTENEDOR DE TARJETAS */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 800px;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 15px;
      padding: 25px;
      text-decoration: none;
      color: #fff;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: #00f0ff;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
      background: rgba(0, 240, 255, 0.1);
    }

    .card h3 {
      font-size: 1.3rem;
      color: #ffe600;
      margin-bottom: 5px;
    }

    .card p {
      font-size: 0.9rem;
      color: #ccc;
    }
  </style>
</head>
<body>

  <!-- SALUDO -->
  <div class="greetings">
    <span>B</span>
    <span>I</span>
    <span>E</span>
    <span>N</span>
    <span>V</span>
    <span>E</span>
    <span>N</span>
    <span>I</span>
    <span>D</span>
    <span>A</span>
  </div>

  <!-- FRASE -->
  <div class="description">
    <span>Un rincón especial diseñado solo para ti ♥</span>
  </div>

  <!-- GRID DE OPCIONES / TARJETAS -->
  <div class="cards-grid">
    
    <!-- Tarjeta 1: Flores Amarillas -->
    <a href="flores/flower.htm" class="card">
      <h3>FLORES AMARILLAS 🌻</h3>
      <p>Una sorpresa especial con música y animación.</p>
    </a>

  </div>

</body>
</html>
