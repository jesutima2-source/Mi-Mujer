<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Un Rincón Especial ♥</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #05070f;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      padding: 20px;
      text-align: center;
    }

    /* TÍTULO ANIMADO BIENVENIDA */
    .greetings {
      font-size: 2.5rem;
      font-weight: 800;
      display: flex;
      gap: 5px;
      margin-bottom: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .greetings span {
      animation: glow 2s ease-in-out infinite alternate;
      color: #444;
    }

    .greetings span:nth-child(1) { animation-delay: 0.1s; }
    .greetings span:nth-child(2) { animation-delay: 0.2s; }
    .greetings span:nth-child(3) { animation-delay: 0.3s; }
    .greetings span:nth-child(4) { animation-delay: 0.4s; }
    .greetings span:nth-child(5) { animation-delay: 0.5s; }
    .greetings span:nth-child(6) { animation-delay: 0.6s; }
    .greetings span:nth-child(7) { animation-delay: 0.7s; }
    .greetings span:nth-child(8) { animation-delay: 0.8s; }
    .greetings span:nth-child(9) { animation-delay: 0.9s; }
    .greetings span:nth-child(10) { animation-delay: 1.0s; }

    @keyframes glow {
      0% {
        color: #333;
        text-shadow: none;
      }
      100% {
        color: #fff;
        text-shadow: 0 0 15px #00d2ff, 0 0 30px #00d2ff;
      }
    }

    /* SUBTÍTULO Y FRASE */
    .description {
      font-size: 1rem;
      letter-spacing: 1.2px;
      color: #e0f8ff;
      margin-bottom: 30px;
      text-shadow: 0 0 8px rgba(0, 210, 255, 0.4);
    }

    /* CONTENEDOR DE TARJETAS (Diseño vertical optimizado para celular) */
    .cards-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 380px;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 210, 255, 0.4);
      border-radius: 16px;
      padding: 18px 20px;
      text-decoration: none;
      color: #fff;
      transition: all 0.3s ease;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(6px);
    }

    .card:hover, .card:active {
      transform: translateY(-3px);
      border-color: #00d2ff;
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
      background: rgba(0, 210, 255, 0.12);
    }

    .card h3 {
      font-size: 1.2rem;
      color: #00d2ff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Destacar un poco más el título de las flores amarillas si deseas */
    .card.flores h3 {
      color: #ffcc00;
    }

    .card p {
      font-size: 0.85rem;
      color: #ccc;
    }
  </style>
</head>
<body>

  <!-- SALUDO -->
  <div class="greetings">
    <span>B</span>
    <span>I</span>
    <span>E</span>
    <span>N</span>
    <span>V</span>
    <span>E</span>
    <span>N</span>
    <span>I</span>
    <span>D</span>
    <span>A</span>
  </div>

  <!-- FRASE -->
  <div class="description">
    <span>Un rincón especial diseñado solo para ti ♥</span>
  </div>

  <!-- MENÚ DE TARJETAS -->
  <div class="cards-grid">
    
    <!-- 1. Flores Amarillas (La que ya teníamos) -->
    <a href="flores/index.html" class="card flores">
      <h3>🌻 FLORES AMARILLAS</h3>
      <p>Para 21/9 una sorpresa espacial para ti</p>
    </a>

    <!-- 2. Nuestro Universo -->
    <a href="universo.html" class="card">
      <h3>🪐 NUESTRO UNIVERSO</h3>
      <p>Nuestra historia, momentos y recuerdos juntos</p>
    </a>

    <!-- 3. Videos y Fotos -->
    <a href="galeria.html" class="card">
      <h3>📸 VIDEOS Y FOTOS</h3>
      <p>Nuestros mejores recuerdos capturados</p>
    </a>

    <!-- 4. Cartas -->
    <a href="cartas.html" class="card">
      <h3>💌 CARTAS</h3>
      <p>Palabras escritas con todo mi corazón</p>
    </a>

  </div>

</body>
</html>
