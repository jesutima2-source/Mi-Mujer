<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestro Rincón - Lámpara</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="lamp-container">
    <div class="lamp-cord-top"></div>
    <div class="lamp-head">
      <div class="lamp-face">
        <div class="eye"></div>
        <div class="eye"></div>
      </div>
      <div class="smile"></div>
    </div>
    
    <!-- Pita y bolita centradas y más abajo -->
    <div class="pull-cord-container" id="pullCord">
      <div class="cord-line" id="cordLine"></div>
      <div class="cord-ball" id="cordBall"></div>
    </div>
  </div>

  <div class="login-card">
    <h2>BIENVENIDOS A NUESTRO RINCON ♥</h2>
    <div class="input-group">
      <label>♥ TU USUARIO ♥</label>
      <input type="text" placeholder="Ingresa tu usuario">
    </div>
    <div class="input-group">
      <label>♥ TU CONTRASEÑA ♥</label>
      <input type="password" placeholder="Ingresa tu contraseña">
    </div>
    <button class="btn-submit">INICIAR</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
