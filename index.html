<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Nuestro Rincón Mágico</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fondo de lona / Canvas para estrellas y nebulosas -->
  <canvas id="bgCanvas"></canvas>

  <!-- Audio de login -->
  <audio id="loginAudio" src="flores/sound/musiclogin.mp3" preload="auto" loop></audio>

  <!-- Reproductor flotante discreto -->
  <div class="player-bar" id="playerBar">
    <button class="play-btn" id="playBtn" title="Reproducir / Pausa">⏸</button>
    <span class="song-title">Te Amo Betzi 💖</span>
  </div>

  <div class="login-container">
    <!-- LÁMPARA CELESTE CON FÍSICAS EN LA TIRITA -->
    <div class="lamp" id="lampButton">
      <div class="lamp-shade">
        <div class="face">
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="mouth"></div>
        </div>
      </div>
      <div class="light-beam" id="lightBeam"></div>
      
      <!-- Cordón con físicas de resorte / rebote -->
      <div class="lamp-cord-container" id="cordContainer">
        <div class="lamp-cord" id="lampCord"></div>
        <div class="cord-handle" id="cordHandle" title="¡Jálame para encender!"></div>
      </div>

      <div class="lamp-base"></div>
    </div>

    <!-- TARJETA NEÓN DE LOGIN -->
    <div class="login-card">
      <form class="login-form" id="loginForm">
        <h2>BIENVENIDOS A NUESTRO RINCON ♥</h2>
        
        <div class="form-group">
          <label for="username">♥ TU USUARIO ♥</label>
          <input type="text" id="username" placeholder="Ingresa tu usuario" required>
        </div>

        <div class="form-group">
          <label for="password">♥ TU CONTRASEÑA ♥</label>
          <input type="password" id="password" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="login-btn">INICIAR</button>
      </form>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
