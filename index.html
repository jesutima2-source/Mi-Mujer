<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIENVENIDOS A NUESTRO RINCON ♥</title>
  <link rel="stylesheet" href="css/style.css?v=9.0">
</head>
<body class="on">

  <div class="login-container">
    <!-- LÁMPARA CELESTE -->
    <div class="lamp">
      <div class="lamp-shade">
        <div class="face">
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="mouth"></div>
        </div>
      </div>
      <div class="light-beam"></div>
      <div class="lamp-cord"></div>
      <div class="lamp-base"></div>
    </div>

    <!-- TARJETA NEÓN -->
    <div class="login-card">
      <form class="login-form" id="loginForm">
        <h2>BIENVENIDOS A NUESTRO RINCON ♥</h2>

        <div class="form-group">
          <label for="username">♥TU USUARIO♥</label>
          <input type="text" id="username" placeholder="Enter your username" required>
        </div>

        <div class="form-group">
          <label for="password">♥TU CONTRASEÑA♥</label>
          <input type="password" id="password" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="login-btn">INICIAR</button>
      </form>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
