<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuestro Rincón - Lámpara</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: #050b14;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Contenedor de la Lámpara */
  .lamp-container {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 20px;
  }

  /* Cable superior fijo */
  .lamp-cord-top {
    width: 2px;
    height: 35px;
    background: #8892b0;
  }

  /* Pantalla de la lámpara */
  .lamp-head {
    width: 140px;
    height: 70px;
    background: linear-gradient(135deg, #233554, #0a192f);
    border-top-left-radius: 70px;
    border-top-right-radius: 70px;
    border: 2px solid #64ffda;
    box-shadow: 0 0 20px rgba(100, 255, 218, 0.4);
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  /* Ojitos y carita de la lámpara */
  .lamp-face {
    display: flex;
    gap: 25px;
    margin-top: 25px;
  }
  .eye {
    width: 6px;
    height: 6px;
    background: #64ffda;
    border-radius: 50%;
  }
  .smile {
    width: 14px;
    height: 7px;
    border-bottom: 2px solid #64ffda;
    border-bottom-left-radius: 10px;
    border-bottom-right-radius: 10px;
    margin-top: 4px;
  }

  /* --- CORRECCIÓN DE LA PITA Y LA BOLITA --- */
  /* Contenedor interactivo de la cuerda que se estira al jalar */
  .pull-cord-container {
    position: absolute;
    bottom: -80px; /* Más larga hacia abajo */
    left: 50%;
    transform: translateX(-50%);
    width: 30px;
    height: 90px;
    cursor: grab;
    display: flex;
    flex-direction: column;
    align-items: center;
    touch-action: none;
    z-index: 10;
  }

  /* La pitita centrada */
  .cord-line {
    width: 2px;
    height: 70px; /* Más larga */
    background: #64ffda;
    box-shadow: 0 0 5px #64ffda;
    transform-origin: top center;
  }

  /* La bolita al final de la pita */
  .cord-ball {
    width: 14px;
    height: 14px;
    background: #64ffda;
    border-radius: 50%;
    box-shadow: 0 0 10px #64ffda;
    margin-top: -1px;
    transform-origin: top center;
  }

  /* Tarjeta de Inicio de Sesión */
  .login-card {
    background: rgba(10, 25, 47, 0.85);
    border: 2px solid rgba(100, 255, 218, 0.3);
    border-radius: 20px;
    padding: 30px;
    width: 90%;
    max-width: 380px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
    text-align: center;
  }

  .login-card h2 {
    color: #fff;
    font-size: 18px;
    margin-bottom: 25px;
    letter-spacing: 1px;
  }

  .input-group {
    text-align: left;
    margin-bottom: 18px;
  }

  .input-group label {
    display: block;
    color: #64ffda;
    font-size: 12px;
    margin-bottom: 8px;
  }

  .input-group input {
    width: 100%;
    padding: 12px 15px;
    background: rgba(2, 12, 27, 0.7);
    border: 1px solid #233554;
    border-radius: 10px;
    color: #fff;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  .input-group input:focus {
    border-color: #64ffda;
  }

  .btn-submit {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #64ffda, #00b4d8);
    border: none;
    border-radius: 10px;
    color: #0a192f;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
    transition: opacity 0.2s, transform 0.1s;
  }

  .btn-submit:hover {
    opacity: 0.9;
    transform: scale(1.02);
  }
</style>
</head>
<body>

  <div class="lamp-container">
    <div class="lamp-cord-top"></div>
    <div class="lamp-head">
      <div class="lamp-face">
        <div class="eye"></div>
        <div class="eye"></div>
      </div>
      <div class="smile"></div>
    </div>
    
    <!-- Pita y bolita centradas y más abajo -->
    <div class="pull-cord-container" id="pullCord">
      <div class="cord-line" id="cordLine"></div>
      <div class="cord-ball" id="cordBall"></div>
    </div>
  </div>

  <div class="login-card">
    <h2>BIENVENIDOS A NUESTRO RINCON ♥</h2>
    <div class="input-group">
      <label>♥ TU USUARIO ♥</label>
      <input type="text" placeholder="Ingresa tu usuario">
    </div>
    <div class="input-group">
      <label>♥ TU CONTRASEÑA ♥</label>
      <input type="password" placeholder="Ingresa tu contraseña">
    </div>
    <button class="btn-submit">INICIAR</button>
  </div>

<script>
  const pullCord = document.getElementById('pullCord');
  const cordLine = document.getElementById('cordLine');
  const cordBall = document.getElementById('cordBall');

  let startY = 0;
  let currentPull = 0;
  const maxPull = 60; // Máxima distancia que se puede estirar

  // Evento táctil o de mouse para empezar a jalar
  function startDrag(e) {
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    startY = clientY;
    
    window.addEventListener('mousemove', onDrag);
    window.addEventListener('touchmove', onDrag);
    window.addEventListener('mouseup', endDrag);
    window.addEventListener('touchend', endDrag);
  }

  // Mientras se arrastra hacia abajo
  function onDrag(e) {
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    currentPull = clientY - startY;

    // Solo permitir jalar hacia abajo (valores positivos)
    if (currentPull < 0) currentPull = 0;
    if (currentPull > maxPull) currentPull = maxPull;

    // Estirar visualmente la línea y mover la bolita
    const scaleY = 1 + (currentPull / 50);
    cordLine.style.transform = `scaleY(${scaleY})`;
    cordBall.style.transform = `translateY(${currentPull}px)`;
  }

  // Al soltar la pita
  function endDrag() {
    window.removeEventListener('mousemove', onDrag);
    window.removeEventListener('touchmove', onDrag);
    window.removeEventListener('mouseup', endDrag);
    window.removeEventListener('touchend', endDrag);

    // Si se jaló lo suficiente (más de 35px), se activa la acción
    if (currentPull > 35) {
      triggerAction();
    }

    // Regresar la pita a su posición original con animación suave
    cordLine.style.transition = 'transform 0.3s ease';
    cordBall.style.transition = 'transform 0.3s ease';
    cordLine.style.transform = 'scaleY(1)';
    cordBall.style.transform = 'translateY(0)';

    setTimeout(() => {
      cordLine.style.transition = 'none';
      cordBall.style.transition = 'none';
    }, 300);

    currentPull = 0;
  }

  function triggerAction() {
    // ACCIÓN CUANDO SE JALA CON ÉXITO (puedes cambiar esto por lo que necesites, ej. cambiar de página o encender luz)
    console.log("¡Lámpara jalada con éxito!");
    // Ejemplo: alert("¡Acción activada!");
  }

  pullCord.addEventListener('mousedown', startDrag);
  pullCord.addEventListener('touchstart', startDrag);
</script>

</body>
</html>
