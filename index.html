<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Nuestro Rincón Mágico</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fondo animado de estrellas fugaces -->
  <div class="starfield"></div>
  <div class="starfield-static"></div>

  <!-- Audio de fondo (Asegúrate de tener musiclogin.mp3 en tu carpeta flores/sound/) -->
  <audio id="loginAudio" src="flores/sound/musiclogin.mp3" preload="auto" loop></audio>

  <!-- Reproductor flotante de música -->
  <div class="player-bar" id="playerBar">
    <button class="play-btn" id="playBtn" title="Reproducir / Pausa">▶</button>
    <span class="song-title">Te Amo Betzi 💖</span>
  </div>

  <div class="main-container">
    <!-- LÁMPARA ESTÉTICA CON CORDÓN Y FÍSICAS DE RESORTE -->
    <div class="lamp-container" id="lampContainer" title="¡Jala la pitita o haz clic para encender/apagar!">
      <div class="lamp-shade">
        <div class="lamp-face">
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="mouth"></div>
        </div>
      </div>
      <div class="light-beam"></div>
      
      <!-- Contenedor con físicas para la pitita -->
      <div class="lamp-cord-container" id="cordContainer">
        <div class="lamp-cord" id="lampCord"></div>
        <div class="cord-handle" id="cordHandle"></div>
      </div>

      <div class="lamp-base"></div>
    </div>

    <!-- TARJETA DE LOGIN -->
    <div class="login-card" id="loginCard">
      <form class="login-form" id="loginForm">
        <h2 class="login-title">BIENVENIDOS A NUESTRO RINCON ♥</h2>
        
        <div class="form-group">
          <label for="username">♥ TU USUARIO ♥</label>
          <input type="text" id="username" placeholder="Ingresa tu usuario" required>
        </div>

        <div class="form-group">
          <label for="password">♥ TU CONTRASEÑA ♥</label>
          <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
        </div>

        <button type="submit" class="login-btn">INICIAR</button>
      </form>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
