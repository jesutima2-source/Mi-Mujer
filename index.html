<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIENVENIDOS A NUESTRO RINCON ♥</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="theme-toggle">
    <label><input type="radio" name="theme" id="radio-on"> ON</label>
    <label><input type="radio" name="theme" id="radio-off" checked> OFF</label>
  </div>

  <div class="login-container">
    <h2>BIENVENIDOS A NUESTRO RINCON ♥</h2>
    
    <form id="loginForm">
      <div class="input-group">
        <label for="username">♥TU USUARIO♥</label>
        <input type="text" id="username" placeholder="Enter your username" required>
      </div>

      <div class="input-group">
        <label for="password">♥TU CONTRASEÑA♥</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn-submit">INICIAR</button>
    </form>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
