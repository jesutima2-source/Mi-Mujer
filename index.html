<div id="login-screen" class="screen active">
  <div class="lamp-container">
    <div class="lamp-cord" id="lamp-cord"></div>
    <div class="lamp-head"></div>
  </div>
  
  <div class="login-card hidden" id="login-card">
    <h2>Nuestro Rincón</h2>
    <input type="text" id="username" placeholder="Usuario">
    <input type="password" id="password" placeholder="Contraseña">
    <button onclick="login()">Ingresar</button>
    <p id="error-msg" class="error"></p>
  </div>
</div>
<div id="main-menu" class="screen">
  <h1>Nuestras Memorias</h1>
  <div class="grid-menu">
    <button onclick="showScreen('flowers-screen')">🌻 Ramo Amarillo (21 Set)</button>
    <button onclick="showScreen('world-love-screen')">🌍 Te Amo en el Mundo</button>
    <button onclick="showScreen('timeline-screen')">📅 Nuestra Historia</button>
    <button onclick="showScreen('videos-screen')">🎬 Nuestros Videos</button>
  </div>
</div>
