<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Elige tu destino</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #010103;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  h1 {
    color: #ffb6c1;
    font-size: clamp(20px, 5vw, 28px);
    letter-spacing: 2px;
    margin-bottom: 30px;
    text-align: center;
    text-shadow: 0 0 10px rgba(255, 105, 180, 0.5);
  }

  .menu-container {
    display: flex;
    flex-direction: column;
    gap: 20px;
    width: 90%;
    max-width: 400px;
  }

  .menu-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    background: rgba(15, 10, 30, 0.75);
    border: 1.5px solid rgba(255, 182, 193, 0.4);
    border-radius: 50px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 15px rgba(255, 105, 180, 0.2);
    color: #ffb6c1;
    text-decoration: none;
    font-size: 18px;
    font-weight: 600;
    transition: all 0.3s ease;
  }

  .menu-btn:hover, .menu-btn:active {
    transform: scale(1.03);
    background: rgba(30, 15, 50, 0.9);
    border-color: rgba(255, 105, 180, 0.9);
    color: #ffffff;
    box-shadow: 0 0 25px rgba(255, 105, 180, 0.5);
  }

  .btn-content {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  /* Flecha limpia que no falla en móviles */
  .arrow {
    font-size: 20px;
    font-weight: bold;
    transition: transform 0.2s ease;
  }

  .menu-btn:hover .arrow {
    transform: translateX(4px);
  }
</style>
</head>
<body>

  <h1>ELIGE TU DESTINO ✨</h1>

  <div class="menu-container">
    <a href="galaxia.html" class="menu-btn">
      <div class="btn-content">
        <span>🌌</span> Galaxia
      </div>
      <span class="arrow">&rarr;</span>
    </a>

    <a href="saturno.html" class="menu-btn">
      <div class="btn-content">
        <span>🪐</span> Saturno
      </div>
      <span class="arrow">&rarr;</span>
    </a>
  </div>

</body>
</html>
